# Placez ce fichier dans .github/workflows/correction.yml
# Déclenchez via Actions > Correction > Run workflow
name: Correction
on:
  workflow_dispatch:
    inputs:
      tp:
        description: 'Numéro du TP'
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      image:
        description: "URL de l'image Docker (requis pour TP3/TP4)"
        required: false
        type: string
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      db:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - run: echo "${{ secrets.CORRECTION_TOKEN }}" | docker login ghcr.io -u student --password-stdin

      - name: Build app from source (TP1-2)
        if: inputs.tp != '3' && inputs.tp != '4'
        run: docker build -t student-app .

      - name: Pull app image (TP3-4)
        if: inputs.tp == '3' || inputs.tp == '4'
        run: |
          if [ -z "${{ inputs.image }}" ]; then
            echo "::error::L'input 'image' est requis pour le TP3/TP4"
            exit 1
          fi
          docker pull "${{ inputs.image }}"
          docker tag "${{ inputs.image }}" student-app

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network host mongo:8 mongosh "mongodb://root:example@localhost:27017" --eval "db.runCommand({ping:1})" > /dev/null 2>&1; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i)"
            sleep 1
          done

      - run: docker run -d --name app --network host -e PORT=8080 -e MONGO_CLUSTER_URL=mongodb://root:example@localhost:27017 -e MONGO_DATABASE=floppa-test -e API_VERSION=${{ inputs.tp }} student-app

      - name: Exécuter les tests
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network host \
            -v ${{ github.workspace }}/reports:/workdir/reports \
            -e GITHUB_TOKEN=${{ github.token }} \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e GITHUB_SHA=${{ github.sha }} \
            -e CORRECTION_TOKEN=${{ secrets.CORRECTION_TOKEN }} \
            ghcr.io/glo2003/trial/law-student:latest \
            floppa --tp ${{ inputs.tp }} --url http://localhost:8080

      - if: always()
        run: cat reports/*.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - if: always()
        run: docker stop app 2>/dev/null || true
